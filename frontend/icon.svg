<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glassSheen)" />
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" />

  <!-- Subtle Radial Accent Ring -->
  <circle cx="256" cy="244" r="142" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Acoustic Soundwave Bars -->
  <g fill="url(#barGrad)" filter="url(#softGlow)">
    <rect x="128" y="206" width="28" height="76" rx="14" opacity="0.85" />
    <rect x="178" y="156" width="28" height="176" rx="14" opacity="0.95" />
    <rect x="228" y="114" width="32" height="260" rx="16" />
    <rect x="282" y="168" width="28" height="152" rx="14" opacity="0.95" />
    <rect x="332" y="196" width="28" height="96" rx="14" opacity="0.85" />
  </g>

  <!-- Multi-Speaker Indicator Pill at Bottom -->
  <rect x="166" y="392" width="180" height="44" rx="22" fill="#0F172A" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
  <circle cx="196" cy="414" r="9" fill="#38BDF8" />
  <circle cx="222" cy="414" r="9" fill="#FB7185" />
  <circle cx="248" cy="414" r="9" fill="#34D399" />
  <rect x="270" y="408" width="54" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.88" />
</svg>
